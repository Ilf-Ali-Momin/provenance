# How each publisher names itself, for masking self references in its own copy.
#
# Why this exists. The pilot run of 2026-09-11 found the outlet's own name
# still inside the corpus text after every other publisher marker had been
# stripped: Fox News in 5 of 10 Fox articles, Vox in 4 of 10, the Guardian in
# 3 of 10. DATA.md requires publisher identity removed from the text before any
# model sees it, and a self reference ("Fox News Digital has reached out") is
# publisher identity just as a byline is.
#
# Masking applies only inside that publisher's own articles. "Fox News" inside
# a Guardian article is content about Fox News and stays; "Fox News" inside a
# Fox article is the outlet naming itself and is replaced with a constant token.
#
# These are factual, not opinions: each list is only the names an outlet uses
# for itself. Matching is case sensitive on whole words, so ordinary words are
# not caught ("nature", "the hill", "the dispatch"). Names that collide with a
# common capitalised word or a person are narrowed to a distinctive form, and
# the narrowing is noted, because an over-eager mask deletes real content:
#   nature.com      bare "Nature" is sentence initial English; journal forms only
#   bloomberg.com   bare "Bloomberg" is also Michael Bloomberg; News forms only
#   reason.com      bare "Reason" is an English word; magazine forms only
#   thefederalist   bare "Federalist" collides with the Federalist Society
#   thehill.com     "the Hill" in lower case is Capitol Hill, so only "The Hill"
#   theatlantic.com "the Atlantic" is the ocean, so only "The Atlantic"
#
# Added after the full run audit: "the Intercept", "the Dispatch" and "Liverpool
# ECHO" appeared unmasked. A capitalised noun after a lower case "the" is safe for
# these two, since the common words are lower case; ocean and hill are not.

