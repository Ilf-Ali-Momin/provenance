# Candidate publishers for the OOD suite.
#
# `stratum` and `lean` are DERIVED from Media Bias/Fact Check labels by
# the rules in eval/ood_collection/mbfc.py. The labels themselves are
# MBFC's, recorded with the URL they came from and the date read. This
# project does not rate publishers (D007, SECURITY.md control 8).
#
# `assigned_category` is the one field this project sets itself, and only
# for factual categories: a wire service is a wire service.
#
# lean is kept as its own axis and never folded into stratum. See D016.
#
# Generated 2026-09-06 over 41 candidates.

