<!doctype html>
<meta charset="utf-8">
<title>Provenance annotation</title>
<style>
  :root {
    --bg: #fbfaf8; --fg: #1a1a1a; --dim: #6b6b6b; --rule: #dcd8d2;
    --card: #ffffff; --accent: #1f4e79;
    --t-factual_assertion: #cfe6f7; --t-opinion: #f7dccf;
    --t-prediction: #e2d9f3; --t-attribution: #d7ecd5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--fg); }
  header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--rule);
           padding: 10px 20px; display: flex; gap: 16px; align-items: center; z-index: 5; }
  #bar { flex: 1; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #count { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; }
  #saved { font-size: 12px; color: var(--dim); min-width: 90px; text-align: right; }
  #who { font: inherit; font-size: 12px; width: 110px; padding: 4px 7px;
         border: 1px solid var(--rule); border-radius: 4px; background: var(--card); }
  main { max-width: 820px; margin: 0 auto; padding: 24px 20px 120px; }
  .meta { font-size: 12px; color: var(--dim); margin-bottom: 10px;
          display: flex; gap: 14px; flex-wrap: wrap; }
  #text { background: var(--card); border: 1px solid var(--rule); border-radius: 6px;
          padding: 20px; white-space: pre-wrap; font-size: 16px; line-height: 1.85;
          user-select: text; cursor: text; }
  mark { padding: 1px 0; border-radius: 2px; cursor: pointer; }
  mark[data-type=factual_assertion] { background: var(--t-factual_assertion); }
  mark[data-type=opinion]           { background: var(--t-opinion); }
  mark[data-type=prediction]        { background: var(--t-prediction); }
  mark[data-type=attribution]       { background: var(--t-attribution); }
  #spans { margin-top: 14px; }
  .span { display: flex; gap: 10px; align-items: baseline; font-size: 13px; padding: 5px 0;
          border-bottom: 1px solid var(--rule); }
  .span code { color: var(--dim); font-size: 11px; white-space: nowrap; }
  .span .txt { flex: 1; }
  .span button { border: 0; background: none; color: #a33; cursor: pointer; font-size: 13px; }
  textarea { width: 100%; margin-top: 14px; padding: 9px; border: 1px solid var(--rule);
             border-radius: 5px; font: inherit; font-size: 13px; background: var(--card);
             resize: vertical; min-height: 54px; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
           border-top: 1px solid var(--rule); padding: 9px 20px; font-size: 12px;
           color: var(--dim); display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  kbd { background: var(--bg); border: 1px solid var(--rule); border-bottom-width: 2px;
        border-radius: 3px; padding: 1px 5px; font: 11px ui-monospace, monospace; color: var(--fg); }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px;
            margin-right: 4px; vertical-align: baseline; }
  #done { color: #2a6b2a; font-weight: 600; }
</style>

<header>
  <strong>Annotation</strong>
  <div id="bar"><div id="fill"></div></div>
  <span id="count"></span>
  <input id="who" placeholder="your name" maxlength="60" autocomplete="off">
  <span id="saved"></span>
</header>

<main>
  <div class="meta" id="meta"></div>
  <div id="text"></div>
  <div id="spans"></div>
  <textarea id="notes" placeholder="notes — a case the guideline does not cover (guideline, Procedure 3)"></textarea>
</main>

<footer>
  <span><kbd>select</kbd> then</span>
  <span><span class="swatch" style="background:var(--t-factual_assertion)"></span><kbd>1</kbd> factual_assertion</span>
  <span><span class="swatch" style="background:var(--t-opinion)"></span><kbd>2</kbd> opinion</span>
  <span><span class="swatch" style="background:var(--t-prediction)"></span><kbd>3</kbd> prediction</span>
  <span><span class="swatch" style="background:var(--t-attribution)"></span><kbd>4</kbd> attribution</span>
  <span><kbd>0</kbd> no claims</span>
  <span><kbd>j</kbd>/<kbd>k</kbd> next/prev</span>
  <span><kbd>u</kbd> undo span</span>
</footer>

<script>
const TYPES = ["factual_assertion", "opinion", "prediction", "attribution"];
let rows = [], i = 0, dirty = new Set();

const $ = id => document.getElementById(id);

async function boot() {
  try { $("who").value = localStorage.getItem("annotator") || ""; } catch (e) { /* ignore */ }
  rows = await (await fetch("passages")).json();
  i = rows.findIndex(r => !r.reviewed);
  if (i < 0) i = 0;
  render();
}

function render() {
  const r = rows[i];
  $("meta").innerHTML = `<span><b>${i + 1}</b> of ${rows.length}</span>
    <span>${r.passage_id}</span><span>${r.domain}</span>
    <span>${r.stratum} · ${r.split}</span>
    ${r.reviewed ? '<span id="done">reviewed</span>' : ""}`;
  paint();
  listSpans();
  $("notes").value = r.notes || "";
  const n = rows.filter(x => x.reviewed).length;
  $("count").textContent = `${n}/${rows.length} reviewed`;
  $("fill").style.width = (100 * n / rows.length) + "%";
}

// Text is rendered as segments each carrying its start offset, so a DOM
// selection maps back to character offsets in the original string even after
// marks have split the text into several nodes.
function paint() {
  const r = rows[i], t = r.text;
  const spans = [...r.spans].sort((a, b) => a.start - b.start);
  const out = [];
  let at = 0;
  for (const s of spans) {
    if (s.start > at) out.push(seg(t.slice(at, s.start), at, null));
    out.push(seg(t.slice(s.start, s.end), s.start, s.type));
    at = s.end;
  }
  if (at < t.length) out.push(seg(t.slice(at), at, null));
  $("text").innerHTML = out.join("");
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function seg(txt, start, type) {
  const tag = type ? "mark" : "span";
  const ty = type ? ` data-type="${type}"` : "";
  return `<${tag} data-s="${start}"${ty}>${esc(txt)}</${tag}>`;
}

function offsetOf(node, off) {
  const host = node.nodeType === 3 ? node.parentElement : node;
  const base = host && host.dataset ? parseInt(host.dataset.s) : NaN;
  return Number.isNaN(base) ? null : base + off;
}

function selection() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) return null;
  const rg = sel.getRangeAt(0);
  if (!$("text").contains(rg.commonAncestorContainer)) return null;
  let a = offsetOf(rg.startContainer, rg.startOffset);
  let b = offsetOf(rg.endContainer, rg.endOffset);
  if (a === null || b === null) return null;
  if (a > b) [a, b] = [b, a];
  // Trim whitespace: offsets point at the claim, not at the space beside it.
  const t = rows[i].text;
  while (a < b && /\s/.test(t[a])) a++;
  while (b > a && /\s/.test(t[b - 1])) b--;
  return b > a ? { start: a, end: b } : null;
}

function addSpan(type) {
  const s = selection();
  if (!s) return;
  const r = rows[i];
  if (r.spans.some(x => x.start < s.end && s.start < x.end)) return;  // no overlaps
  r.spans.push({ start: s.start, end: s.end, type });
  window.getSelection().removeAllRanges();
  mark();
}

function listSpans() {
  const r = rows[i];
  $("spans").innerHTML = [...r.spans].sort((a, b) => a.start - b.start).map(s =>
    `<div class="span"><code>${s.start}–${s.end}</code>
       <span class="txt"><b>${s.type}</b> · ${esc(r.text.slice(s.start, s.end))}</span>
       <button data-start="${s.start}">remove</button></div>`).join("")
    || `<div class="span" style="border:0;color:var(--dim)">no spans — correct for a passage that makes no claims</div>`;
}

function mark() {
  rows[i].reviewed = true;
  rows[i].notes = $("notes").value;
  dirty.add(i);
  render();
  save();
}

let timer = null;
function save() {
  clearTimeout(timer);
  $("saved").textContent = "saving…";
  timer = setTimeout(async () => {
    const payload = [...dirty].map(k => rows[k]);
    if (!payload.length) return;
    const res = await fetch("save", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify(payload),
    });
    $("saved").textContent = res.ok ? "saved" : "SAVE FAILED";
    if (res.ok) {
      dirty.clear();
      // Someone else may have marked passages since this page loaded.
      const body = await res.json().catch(() => null);
      if (body && typeof body.reviewed === "number") {
        $("count").textContent = `${body.reviewed}/${rows.length} reviewed`;
        $("fill").style.width = (100 * body.reviewed / rows.length) + "%";
      }
    }
  }, 400);
}

function go(d) {
  rows[i].notes = $("notes").value;
  if (rows[i].reviewed) { dirty.add(i); save(); }
  i = Math.min(rows.length - 1, Math.max(0, i + d));
  render();
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  const k = e.key;
  if (k >= "1" && k <= "4") { e.preventDefault(); addSpan(TYPES[+k - 1]); }
  else if (k === "0") { e.preventDefault(); mark(); go(1); }
  else if (k === "j" || k === "ArrowRight") { e.preventDefault(); go(1); }
  else if (k === "k" || k === "ArrowLeft") { e.preventDefault(); go(-1); }
  else if (k === "u") {
    e.preventDefault();
    const r = rows[i];
    if (r.spans.length) { r.spans.pop(); mark(); }
  }
});

$("spans").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  const start = +b.dataset.start;
  rows[i].spans = rows[i].spans.filter(s => s.start !== start);
  mark();
});

$("notes").addEventListener("blur", () => {
  if (rows[i].notes !== $("notes").value) { rows[i].notes = $("notes").value; dirty.add(i); save(); }
});

boot();
</script>
