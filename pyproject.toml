[project]
name = "provenance"
version = "0.0.0"
description = "Evidence surfacing for claims. Provenance, not verdicts."
requires-python = ">=3.12,<3.13"
dependencies = [
  # Approved 2026-08-31 for the SSRF guarded fetcher (SECURITY.md control 1).
  # httpx is chosen over requests for its transport hook, which is what makes
  # connect-to-validated-IP-while-sending-the-original-Host-header expressible
  # without monkeypatching the connection pool. See DECISIONS.md D015.
  "httpx>=0.27",
  # Mandated by RULES.md: Pydantic v2 across process boundaries, and
  # pydantic-settings for configuration, so no timeout or cap is a literal.
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  # Postgres driver. Implied by ARCHITECTURE.md's "Postgres 16 with pgvector";
  # the binary build avoids a libpq toolchain on developer machines.
  "psycopg[binary]>=3.2",
  # Approved 2026-08-31. Article text extraction for the OOD collector. Note
  # it does not strip datelines or bylines; pipeline/text/extract.py does, and
  # that is a construction rule rather than a tidying step (DATA.md).
  "trafilatura>=2.0",
]

[dependency-groups]
# Tooling only at M0. Runtime dependencies arrive with the components that need
# them, per milestone. Pinning with hashes happens in the lockfile (RULES.md,
# "Model artefacts" / SECURITY.md control 3), not here.
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pip-audit>=2.7",
  "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "eval"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["pipeline", "eval", "tests"]

[tool.ruff.lint]
# Selection is chosen against RULES.md and SECURITY.md rather than by taste:
#   ANN  every function signature is annotated
#   T20  no print; structlog only
#   S    flake8-bandit, standing in for the static half of SECURITY.md
#   B    flake8-bugbear, catches except/pass and mutable default classes of bug
#   PTH  pathlib over os.path, so path handling is uniform at the fetch boundary
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # import order
  "N",           # naming
  "UP",          # pyupgrade
  "ANN",         # annotations
  "B",           # bugbear
  "S",           # bandit
  "T20",         # no print
  "SIM",         # simplify
  "RET",         # return consistency
  "PTH",         # pathlib
  "RUF",
]
ignore = [
  "ANN401",  # typing.Any is sometimes the honest annotation at a boundary
]
# RUF001 exists to catch homoglyphs smuggled into source, which is a real
# attack this project takes seriously. These three are the exception: the
# extraction regexes must match the typography real publishers actually emit
# (curly apostrophe in bylines, en and em dash in datelines), and replacing
# them with ASCII would silently stop the publisher stripping from firing on
# most wire copy. Allowed by codepoint so the config stays reviewable.
allowed-confusables = ["’", "–", "—"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # assert is the point
  "S105", "S106",  # hardcoded test credentials in fixtures
  "ANN201",  # test functions need no return annotation
]

[tool.ruff.lint.flake8-bandit]
# Adversarial fixtures legitimately contain hostile-looking constants.
check-typed-exception = true

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
# RULES.md mandates strict on app/ and pipeline/. eval/ is added here because
# evaluation code ships as a deliverable (see context/DECISIONS.md D011).
# app/ is added at M1 when the Flask skeleton exists.
files = ["pipeline", "eval"]
warn_unreachable = true
disallow_any_unimported = true
show_error_codes = true

[[tool.mypy.overrides]]
# Notebooks are exempt per RULES.md, and nothing in a notebook ships.
module = "notebooks.*"
ignore_errors = true

[[tool.mypy.overrides]]
# These ship no stubs and no py.typed marker. Declaring them is not a
# relaxation of strict mode: our own code stays fully checked, and values
# crossing this boundary are annotated explicitly at the call site.
module = ["sklearn.*", "datasets.*", "transformers.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  # Model behaviour tests are slow and gate releases, not commits (RULES.md).
  "-m", "not model and not integration",
]
markers = [
  "adversarial: hostile-input suites from SECURITY.md. First class, gates releases.",
  "model: loads a checkpoint or calls a model service. Slow. Excluded by default.",
  "contract: endpoint behaviour against the schemas in context/API.md.",
  "integration: needs the docker compose stack up. Excluded by default; never runs in CI.",
]
xfail_strict = true
filterwarnings = ["error"]
