# ---------------------------------------------------------------------------
# Corpus manifest
#
# Every corpus this project touches has an entry here before it is downloaded,
# read, or referenced in code. The manifest exists to make two distinctions
# explicit and machine checkable:
#
#   1. "publicly accessible" is not "permitted to redistribute"   (DATA.md)
#   2. "available for use" is not "permitted for training"        (D010)
#
# Both are recorded per corpus, not assumed and not decided at use time.
#
# This file is intentionally empty. Entries are appended by the milestone that
# introduces the corpus. Adding an entry is a documentation change and belongs
# in the same commit as the code that consumes it (RULES.md, Documentation).
# ---------------------------------------------------------------------------

schema_version: 1

# ---------------------------------------------------------------------------
# Entry schema
#
# Required fields are marked (required). An entry missing a required field is
# an incomplete entry, not a permissive one: absent means unknown, and unknown
# is treated as prohibited for both redistribution and training.
#
# corpora:
#   - id: str                       (required) stable slug, referenced from code
#     name: str                     (required) human name as its publisher gives it
#     role: enum                    (required) what this corpus is for. One of:
#                                     retrieval_reference     local pgvector index
#                                     stance_training         NLI training / eval
#                                     claim_extraction_eval   extractor validation
#                                     rhetoric_weak_supervision
#                                     ood_suite               the frozen OOD set
#                                     leakage_demonstration_only
#     purpose: str                  (required) one sentence, why it is here
#
#     # --- provenance -------------------------------------------------------
#     source_url: str               (required) canonical URL of the corpus
#     access_date: date             (required) ISO 8601, when it was retrieved
#     snapshot_date: date           (required for anything built or scraped by
#                                    this project) the date the content reflects
#     publisher: str                who distributes it
#
#     # --- rights -----------------------------------------------------------
#     licence: str                  (required) SPDX identifier, or free text if
#                                    the terms are not an SPDX licence
#     licence_url: str              (required) where those terms were read
#     attribution: str              (required if the licence requires it) the
#                                    citation string to reproduce verbatim
#     redistribution: enum          (required) may this project redistribute it
#                                    permitted | prohibited | permitted_with_attribution
#     terms_notes: str              anything in the terms that constrains use,
#                                    quoted rather than paraphrased
#
#     # --- use restrictions -------------------------------------------------
#     training_use: enum            (required) permitted | prohibited
#     training_use_reason: str      (required when prohibited) why, with the
#                                    DECISIONS.md entry that decided it.
#                                    The ISOT style corpus is prohibited here
#                                    under D010 and that is not overridable by
#                                    a task instruction.
#     evaluation_use: enum          (required) permitted | prohibited
#
#     # --- storage ----------------------------------------------------------
#     checked_in: bool              (required) false for everything but tiny
#                                    annotation files. See .gitignore.
#     retrieval:                    (required when checked_in is false)
#       method: enum                download_script | api | manual
#       script: str                 repo relative path, e.g. pipeline/data/fetch_fever.py
#       notes: str                  credentials required, rate limits observed
#     storage:
#       location: str               bucket or path, not a personal machine
#       region: str                 (required when personal_data.contains) EU region
#       encrypted_at_rest: bool     (required when personal_data.contains) must be true
#
#     # --- integrity --------------------------------------------------------
#     record_count: int             (required once frozen)
#     sha256: str                   (required once frozen) over the archive or
#                                    over a sorted per file digest listing
#     frozen: bool                  (required) true once the content may not change
#     frozen_at: datetime           (required when frozen)
#
#     # --- splits -----------------------------------------------------------
#     # DATA.md: grouped by publishing domain, never random. Temporal as a
#     # second axis where dates exist. Three way, with the frozen holdout
#     # inspected exactly twice in the project (D009).
#     splits:
#       method: enum                grouped_by_domain | grouped_by_domain_and_temporal | none
#       group_key: str              the field the grouping is on
#       temporal_boundary: date     train before, evaluate after
#       train: int
#       dev: int
#       frozen_holdout: int
#       holdout_inspections: list   ISO dates. Length must never exceed 2 (D009).
#
#     # --- personal data ----------------------------------------------------
#     # News text names individuals, which puts this project in scope as a
#     # controller (DATA.md, SECURITY.md control 6).
#     personal_data:
#       contains: bool              (required)
#       lawful_basis: str           (required when contains) e.g. legitimate interest, research
#       balancing_test: str         (required when contains) path to the written test
#       retention: str              (required when contains) and what happens at expiry
#
#     # --- normalisation ----------------------------------------------------
#     # Recorded because identical processing across strata is what stops this
#     # project reproducing the leakage it exists to document.
#     normalisation:
#       extraction_pipeline: str    version or git SHA of the extractor used
#       identical_across_strata: bool  (required for ood_suite) must be true
#       publisher_markers_stripped: bool
#
#     notes: str
# ---------------------------------------------------------------------------

corpora:
  - id: isot_style_kaggle_mirror
    name: ISOT style fake news corpus (HuggingFace mirror)
    role: leakage_demonstration_only
    purpose: >-
      Reproduce and document the leakage failure described in DATA.md and
      EVALUATION.md section 2. This corpus exists in the project to be
      criticised, not to be learned from.

    # --- provenance ---------------------------------------------------------
    source_url: https://huggingface.co/datasets/ErfanMoosaviMonazzah/fake-news-detection-dataset-English
    access_date: 2026-08-30
    snapshot_date: 2026-08-30
    publisher: >-
      Third party mirror on the HuggingFace hub. NOT the original ISOT
      distribution from the University of Victoria, and not the Kaggle
      upload. Provenance is therefore weaker than a first party download and
      every number derived from it carries that caveat.

    # --- rights -------------------------------------------------------------
    licence: not stated on the mirror
    licence_url: https://huggingface.co/datasets/ErfanMoosaviMonazzah/fake-news-detection-dataset-English
    attribution: >-
      Ahmed H, Traore I, Saad S. Detecting opinion spam and fake news using
      text classification. Security and Privacy, 2017. Cite the original
      authors, not the mirror.
    redistribution: prohibited
    terms_notes: >-
      The mirror states no licence. Under the rule at the head of this file,
      unknown is treated as prohibited for both redistribution and training.

    # --- use restrictions ---------------------------------------------------
    training_use: prohibited
    training_use_reason: >-
      DECISIONS.md D010, accepted and non negotiable. The leakage is in the
      label structure itself, so augmentation, pretraining and auxiliary task
      use are all prohibited, not only direct supervision. The models trained
      in eval/leakage/ are throwaway probes for the ablation and are never
      loaded by any serving path.
    evaluation_use: permitted

    # --- storage ------------------------------------------------------------
    checked_in: false
    retrieval:
      method: api
      script: eval/leakage/ablations.py
      notes: >-
        Fetched through the datasets library at run time into the local HF
        cache. No copy is committed to the repository.
    storage:
      location: local HuggingFace datasets cache, not in the repository

    # --- integrity ----------------------------------------------------------
    record_count: 44267
    class_counts:
      wire_service_true: 21416
      heterogeneous_false: 22851
    frozen: false

    # --- splits -------------------------------------------------------------
    splits:
      method: none
      train: 36000
      dev: 0
      frozen_holdout: 8267
      holdout_inspections: []
      notes: >-
        Random splits, deliberately. DATA.md mandates grouped splits by domain
        for anything this project builds on, but section 2 of EVALUATION.md
        requires reproducing the standard approach exactly as commonly done,
        and the standard approach splits randomly. The random split is part of
        what is being criticised. The mirror ships train, validation and test;
        train and validation are concatenated here and its test split is used
        as the held out set.

    # --- personal data ------------------------------------------------------
    personal_data:
      contains: true
      lawful_basis: legitimate interest, research
      balancing_test: not yet written
      retention: >-
        Held only in the local HF cache for the duration of the ablation. No
        article text is committed, and none reaches any project database.

    # --- normalisation ------------------------------------------------------
    normalisation:
      extraction_pipeline: upstream, not performed by this project
      identical_across_strata: false
      publisher_markers_stripped: partial
      notes: >-
        MEASURED, not assumed. Only 0.3 percent of the wire service half
        retains a "(Reuters)" marker in its first 200 characters, against a
        near universal rate in the original ISOT distribution. The mirror has
        been pre-stripped of the dateline prefix. This materially weakens
        ablation 1, whose stated target is the dateline, and the ablation is
        reported with that limitation stated rather than silently reinterpreted.

    notes: >-
      Every accessible mirror checked (this one, AlexanderHolmes0/true-fake-news,
      Pulk17/Fake-News-Detection-dataset) is dateline stripped at the same
      0.3 percent rate. Chosen over AlexanderHolmes0, which matches the
      canonical class counts exactly, because this mirror retains the subject
      and date columns that expose further leakage channels.

  - id: ood_suite_2026
    name: Out of distribution evaluation suite, 2026
    role: ood_suite
    purpose: Frozen English news articles published after the training snapshot, stratified
      by publisher type, for out of distribution evaluation only.
    source_url: eval/ood_collection/sources.yaml
    access_date: '2026-09-11'
    snapshot_date: '2026-01-01'
    publisher: many; see sources.yaml and the document records
    licence: publisher copyright; not licensed for redistribution
    licence_url: per publisher
    redistribution: prohibited
    terms_notes: Collected through publisher feeds and sitemaps, robots.txt honoured on every
      request, refusals recorded and never worked around (D019).
    training_use: prohibited
    training_use_reason: Evaluation only. Never a training source (DATA.md, D009).
    evaluation_use: permitted
    checked_in: false
    retrieval:
      method: download_script
      script: eval/ood_collection/run.py
      notes: Rerunning collects a different corpus; the frozen files are the suite.
    storage:
      location: data/ood/frozen on a FileVault encrypted local disk
      region: 'OPEN OBLIGATION: not the EU region SECURITY.md control 6 requires'
      encrypted_at_rest: true
    record_count: 384
    sha256: 9c59a053dfdd2214c2fe8d7749adb19aa6f4127510aaafbbb0d99676175c4a24
    frozen: true
    frozen_at: '2026-09-11T20:52:09.010531+00:00'
    splits:
      method: grouped_by_domain
      seed: 20260101
      train: 219
      dev: 93
      frozen_holdout: 72
      domains_per_split:
        train: 18
        dev: 7
        holdout: 6
      domains_in_more_than_one_split: []
      splits_per_stratum:
        national:
        - dev
        - holdout
        - train
        partisan:
        - dev
        - holdout
        - train
        regional:
        - dev
        - holdout
        - train
        wire:
        - train
      strata_missing_a_split:
      - wire
      holdout_inspections: []
    personal_data:
      contains: true
      lawful_basis: legitimate interest, research
      balancing_test: 'OPEN OBLIGATION: not yet written'
      retention: Held for the evaluation; deletion procedure not yet implemented.
    normalisation:
      extraction_pipeline: 2fbca13+reclean:3489893
      identical_across_strata: true
      publisher_markers_stripped: true
      notes: Datelines, bylines, boilerplate, newsletter promotions, own outlet names and self
        disclosures removed per D018; English only per D020.
    notes: '{"duplicates_removed": 1, "partisan_balance": {"per_side": 127, "dropped_for_balance":
      35}, "topic_unknown_rate": 0.8802, "cells_stratum_topic": {"national/business": 1, "national/unknown":
      39, "partisan/business": 5, "partisan/health": 2, "partisan/politics": 26, "partisan/science":
      1, "partisan/unknown": 220, "regional/business": 7, "regional/health": 2, "regional/politics":
      2, "regional/unknown": 64, "wire/unknown": 15}}'
