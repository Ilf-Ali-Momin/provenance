    notes: '{"duplicates_removed": 2, "partisan_balance": {"per_side": 68, "dropped_for_balance": 59}, "topic_unknown_rate": 0.9361, "cells_stratum_topic": {"national/politics": 1, "national/science": 1, "national/unknown": 71, "partisan/business": 1, "partisan/health": 1, "partisan/politics": 12, "partisan/science": 1, "partisan/unknown": 121, "regional/unknown": 27, "wire/unknown": 30}, "supersedes": "ood_suite_2026_spread (v3, 266 records, sha f7b361e5); and before it the 2026-09-11 freeze of 384 records from a single day of news", "source_run": "data/ood/run-7800954-clean", "residue_after_audit": {}, "residual_check": {"stratum_grouped_by_publisher": 0.5981, "stratum_majority_baseline": 0.5988, "publisher_identity": 0.3829, "publisher_identity_chance": 0.0821}, "under_target": "266 documents against the 400-600 the collection plan asks for; the pool is deliberately not widened (D028)", "non_articles_excluded": {"newsletter_issue": 1, "solicitation": 1}}'
