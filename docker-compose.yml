# Local dependency stack for M1. Mirrors the single instance deployment in
# ARCHITECTURE.md rather than inventing a second topology for development.
#
# Hardening per SECURITY.md control 9: no container runs as root, all
# capabilities are dropped and only what is needed is added back, privilege
# escalation is blocked, and every service carries memory, CPU and PID limits
# so one runaway request cannot exhaust the host.
#
# Both services bind to 127.0.0.1 only. A database reachable from the local
# network is the kind of exposure this project is otherwise built to prevent.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    user: "999:999"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      # Postgres refuses to start on an existing cluster without this when the
      # data directory is a named volume owned by a non default uid.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-pgvector.sql:/docker-entrypoint-initdb.d/00-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    user: "999:1000"
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128

volumes:
  pgdata:
  redisdata:
