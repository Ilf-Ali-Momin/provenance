# Pre-commit is the local half of the CI gate in .github/workflows/ci.yml.
#
# It runs the checks that are fast and need no network: ruff, gitleaks, and the
# unpinned model reference check. mypy, pytest and pip-audit run in CI only -
# they need the ML extra installed or an advisory database fetched, and a commit
# hook slow enough to be bypassed with --no-verify is a hook that is bypassed.
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: check-model-pins
        name: unpinned model references
        # The repo's interpreter, not PATH's: this hook imports project code
        # and must run against the same environment the tests do. CI runs the
        # same check as its own job, so a developer without .venv is still gated.
        entry: .venv/bin/python -m tools.check_model_pins pipeline eval app tools
        language: system
        pass_filenames: false
        types: [python]
